# Same as run.default.yaml except that Hexaly enforces the time windows as hard
# constraints instead of a first-priority lateness objective (its template's idiom).
# Used once, to pick hexaly.time_windows for the published run.

seed: 42
solvers: [hexaly]
time_limits_s:
  200: 60
  400: 120
  600: 180
  default: 300
threads: 1
cw:
  multistart_runs: 20
  lambda_range: [0.6, 1.4]
  savings_noise: 0.10
  neighbours: 30
cw_ls:
  neighbours: 30
ortools:
  first_solution: PATH_CHEAPEST_ARC
  metaheuristic: GUIDED_LOCAL_SEARCH
  log_search: false
hexaly:
  nb_threads: 1
  license_path: null
  unserved: disjoint
  time_windows: hard
outputs:
  plots: false
  basemap: esri-gray
