# Companion of run.n600_360s.yaml: Hexaly with the disjoint-list (template) formulation at
# the doubled limit, so the 180 s -> 360 s comparison exists for both Hexaly formulations.

seed: 42
solvers: [hexaly]
time_limits_s:
  600: 360
  default: 360
threads: 1
cw:
  multistart_runs: 20
  lambda_range: [0.6, 1.4]
  savings_noise: 0.10
  neighbours: 30
cw_ls:
  neighbours: 30
ortools:
  first_solution: PATH_CHEAPEST_ARC
  metaheuristic: GUIDED_LOCAL_SEARCH
  log_search: false
hexaly:
  nb_threads: 1
  license_path: null
  time_windows: soft
  objective: lexicographic
  unserved: disjoint
outputs:
  plots: false
  basemap: esri-gray
