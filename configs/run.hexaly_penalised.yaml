# Secondary experiment (not equal-footing with results/final by design of the question,
# equal in every other respect): Hexaly with ONE scalar objective, cost + P x unserved,
# P above any routing cost - the shape OR-Tools optimises - instead of the lexicographic
# pair (maximise served, then minimise cost). Same limits, one thread, same seed.

seed: 42
solvers: [hexaly]
time_limits_s:
  200: 60
  400: 120
  600: 180
  default: 300
threads: 1
cw:
  multistart_runs: 20
  lambda_range: [0.6, 1.4]
  savings_noise: 0.10
  neighbours: 30
cw_ls:
  neighbours: 30
ortools:
  first_solution: PATH_CHEAPEST_ARC
  metaheuristic: GUIDED_LOCAL_SEARCH
  log_search: false
hexaly:
  nb_threads: 1
  license_path: null
  unserved: disjoint
  time_windows: soft
  objective: penalised
outputs:
  plots: false
  basemap: esri-gray
