# Experiment of 2026-09-23 (now the published formulation): Hexaly with the unserved customers collected in an extra, uncosted
# list under a partition constraint (`unserved: dummy_list`) instead of disjoint lists. Same
# feasible set and objective; Hexaly 15's parallel search only engages for partition models
# (measured: disjoint models stay at one core whatever nb_threads says), and the partition
# constraint is also cheaper to maintain. One thread, same limits and seed as results/final.

seed: 42
solvers: [hexaly]
time_limits_s:
  200: 60
  400: 120
  600: 180
  default: 300
threads: 1
cw:
  multistart_runs: 20
  lambda_range: [0.6, 1.4]
  savings_noise: 0.10
  neighbours: 30
cw_ls:
  neighbours: 30
ortools:
  first_solution: PATH_CHEAPEST_ARC
  metaheuristic: GUIDED_LOCAL_SEARCH
  log_search: false
hexaly:
  nb_threads: 1
  license_path: null
  time_windows: soft
  objective: lexicographic
  unserved: dummy_list
outputs:
  plots: false
  basemap: esri-gray
